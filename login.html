<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AttendEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Montserrat", sans-serif;
            background: linear-gradient(135deg, #F4F7FB 0%, #E8EEF5 100%);
            min-height: 100vh;
        }

        /* ========== NAVBAR ========== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #172B4D;
            color: white;
            padding: 15px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 10px rgba(23, 43, 77, 0.25);
            flex-wrap: wrap;
        }

        .navbar h2 {
            margin: 0;
            font-size: 22px;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
        }

        .nav-links a:hover {
            background-color: #3B6B96;
        }

        /* ========== AUTH PAGE ========== */
        .auth-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 68px);
            padding: 30px 20px;
        }

        .auth-card {
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-logo h1 {
            color: #172B4D;
            font-size: 26px;
            margin: 0;
        }

        .auth-logo h1 span {
            color: #3B6B96;
        }

        .auth-card h2 {
            text-align: center;
            color: #172B4D;
            font-size: 22px;
            margin: 10px 0 6px;
        }

        .auth-subtitle {
            text-align: center;
            color: #526579;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #243F60;
            font-weight: 600;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3B6B96;
            box-shadow: 0 0 0 3px rgba(59, 107, 150, 0.15);
        }

        .auth-btn {
            width: 100%;
            padding: 13px;
            background-color: #172B4D;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
        }

        .auth-btn:hover {
            background-color: #3B6B96;
        }

        .auth-btn:disabled {
            background-color: #94A3B8;
            cursor: not-allowed;
        }

        .auth-message {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            min-height: 18px;
            font-weight: 600;
        }

        .auth-message.error {
            color: #B91C1C;
        }

        .auth-message.success {
            color: #047857;
        }

        .auth-switch {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #526579;
        }

        .auth-switch a {
            color: #3B6B96;
            text-decoration: none;
            font-weight: 700;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        .auth-back {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #94A3B8;
            text-decoration: none;
        }

        .auth-back:hover {
            color: #3B6B96;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 42px;
        }

        .toggle-pass {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .navbar {
                padding: 12px 20px;
            }

            .menu-btn {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                background-color: #172B4D;
                margin-top: 12px;
                padding: 10px 0;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                gap: 4px;
            }

            .nav-links.open {
                display: flex;
            }

            .nav-links a {
                padding: 12px 15px;
                border-radius: 0;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .navbar h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2>AttendEase</h2>
        <button class="menu-btn" onclick="toggleMenu()" aria-label="Open menu">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home 🏠</a>
            <a href="about.html">About ℹ️</a>
            <a href="attendance.html">Attendance 📋</a>
            <a href="contact.html">Contact 📞</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>Attend<span>Ease</span></h1>
            </div>

            <h2>Welcome Back 👋</h2>
            <p class="auth-subtitle">Login to manage your attendance</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-pass" onclick="togglePassword()">👁️</button>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="loginBtn">Login</button>
                <p class="auth-message" id="message"></p>
            </form>

            <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
            <a href="index.html" class="auth-back">← Back to Home</a>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById("navLinks").classList.toggle("open");
        }

        function togglePassword() {
            const i = document.getElementById("password");
            i.type = (i.type === "password") ? "text" : "password";
        }

        if (localStorage.getItem("currentUser")) {
            window.location.href = "attendance.html";
        }

        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");
            const btn = document.getElementById("loginBtn");

            message.textContent = "";
            message.className = "auth-message";

            const users = JSON.parse(localStorage.getItem("users")) || [];
            const user = users.find(function (u) {
                return u.email === email && u.password === password;
            });

            if (!user) {
                message.textContent = "❌ Invalid email or password.";
                message.classList.add("error");
                return;
            }

            localStorage.setItem("currentUser", JSON.stringify({
                name: user.name,
                email: user.email
            }));

            btn.disabled = true;
            btn.textContent = "Logging in...";
            message.textContent = "✅ Login successful! Redirecting...";
            message.classList.add("success");

            setTimeout(function () {
                window.location.href = "attendance.html";
            }, 800);
        });
    </script>

</body>
</html>
