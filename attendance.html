<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendEase - Mark Attendance</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="attendance.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header>
        <div class="logo">AttendEase</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="attendance.html" class="active">Mark Attendance</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Section: Add a New Student -->
        <section class="add-student-section">
            <h2>Add New Student</h2>
            <div class="form-group">
                <input type="text" id="studentName" placeholder="Enter Student Name" required>
                <input type="text" id="studentRoll" placeholder="Enter Roll Number" required>
                <button onclick="addStudent()">Add Student</button>
            </div>
        </section>

        <!-- Section: Mark Attendance -->
        <section class="attendance-section">
            <div class="section-header">
                <h2>Student List</h2>
                <div class="date-picker-container">
                    <label for="datePicker">Select Date:</label>
                    <input type="date" id="datePicker" onchange="loadStudents()">
                </div>
            </div>

            <!-- Loading Message (Hidden by default) -->
            <div id="loading" style="display: none; text-align: center; margin: 20px; color: #3182ce;">
                <p><strong>Connecting to server...</strong> (If this is the first time today, it may take 30 seconds to wake up).</p>
            </div>

            <!-- Table displaying students -->
            <div class="table-container">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentList">
                        <!-- Students will be loaded here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Link to your JavaScript file -->
    <script src="attendance.js"></script>
</body>
</html>
